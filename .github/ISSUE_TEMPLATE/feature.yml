name: 功能需求
description: 为一个可追踪的 Feature 创建需求记录。
title: "[Feature]: "
labels: ["feature"]
body:
  - type: input
    id: feature_id
    attributes:
      label: Feature ID
      description: 填写唯一的 Feature 标识。
      placeholder: F-000
    validations:
      required: true
  - type: textarea
    id: user_story
    attributes:
      label: 用户故事
      description: 使用“作为...，我希望...，从而...”描述用户价值。
    validations:
      required: true
  - type: textarea
    id: input_output_contract
    attributes:
      label: 输入/输出契约
      description: 明确输入、输出、边界条件和兼容性约束。
    validations:
      required: true
  - type: dropdown
    id: data_classification
    attributes:
      label: 数据分级
      description: 选择本 Feature 涉及的最高数据分级。
      options:
        - 公开
        - 内部
        - 机密
        - 受限
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 依赖项
      description: 列出相关 Issue、服务、团队、接口或“不适用”。
    validations:
      required: true
  - type: textarea
    id: acceptance_checks
    attributes:
      label: 验收检查
      description: 列出可验证的验收条件和预期证据。
    validations:
      required: true
  - type: textarea
    id: external_prerequisites
    attributes:
      label: 外部前置条件
      description: 列出需要在仓库外完成的审批、权限、配置或“不适用”。
    validations:
      required: true